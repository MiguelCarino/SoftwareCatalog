<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Software Catalog</title>
    <link rel="icon" type="image/x-icon" href="assets/images/logo.webp">
    <link rel="stylesheet" href="fonts/carino-fonts.css">
    <link rel="stylesheet" href="assets/vendor/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>

<header class="sc-toolbar" data-carino-strip>
    <div data-carino-actions style="display:flex;align-items:center;gap:12px;min-width:0">
        <div class="header-search">
            <input type="text" id="search-input" placeholder="Search software...">
            <button id="platform-btn" class="platform-btn" aria-label="Platform filter"></button>
        </div>
        <button id="open-only-btn" class="icon-btn" aria-pressed="false" title="Open source only" aria-label="Open source only">
            <i class="fa-brands fa-osi" aria-hidden="true"></i>
        </button>
        <button id="my-list-btn" class="icon-btn my-list-btn" aria-pressed="false" title="My List" aria-label="My List">
            <i class="fa-solid fa-bookmark" aria-hidden="true"></i>
            <span class="my-list-label" data-i18n data-i18n-key="My List">My List</span>
            <span class="my-list-count" id="my-list-count"></span>
        </button>
    </div>
</header>

<div class="workspace">
    <nav class="slice-menu" id="sliceMenu"></nav>
    <main class="stage" id="stage"></main>
</div>

<script src="assets/js/main.js"></script>
<script src="carino-navbar.js" data-app="Software" data-repo="SoftwareCatalog" defer></script>
<script src="carino-lang.js" defer></script>
<script src="i18n.js" defer></script>
</body>
</html>
