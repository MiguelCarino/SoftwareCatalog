    <!-- Theme before first paint, so neither theme flashes the other:
         ?theme=gold|color (review links; not stored) > carino-theme cookie
         (shared across *.carino.systems) > localStorage > Gold & Black. -->
    <meta name="theme-color" content="#050505" id="scThemeColor">
    <script>
    (function () {
        var d = document.documentElement, t = null;
        function pick(v) { return v === 'gold' ? 'gold' : (v === 'color' || v === 'colour') ? 'color' : null; }
        try { t = pick(new URLSearchParams(location.search).get('theme')); } catch (e) {}
        if (!t) { try { var m = document.cookie.match(/(?:^|;\s*)carino-theme=([^;]*)/); if (m) t = pick(decodeURIComponent(m[1])); } catch (e) {} }
        if (!t) { try { t = pick(localStorage.getItem('carino-theme')); } catch (e) {} }
        t = t || 'gold';
        d.setAttribute('data-carino-theme', t);
        var dark = d.getAttribute('data-theme') !== 'light' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches;
        var meta = document.getElementById('scThemeColor');
        if (meta) meta.content = t === 'gold' ? '#050505' : (dark ? '#0e1420' : '#eef3fc');
    })();
    </script>

<!-- The search is the hero: one sticky bar with the search pill and the
     category tabs. The Software mark lives in the navbar as the theme switch
     (main.js); the tabs stay hidden on the storefront, whose category tiles
     do their job there. -->
<header class="sc-head" id="scHead">
    <h1 class="sr-only">Carino Software</h1>
    <div class="sc-head-in">
        <div class="sc-row1">
            <div class="sc-search" role="search">
                <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
                <input type="search" id="find" class="sc-find" autocomplete="off" spellcheck="false" placeholder="Find software" aria-label="Find software">
                <button type="button" class="sc-find-clear" id="findClear" aria-label="Clear search" hidden><i class="fa-solid fa-xmark" aria-hidden="true"></i></button>
                <span class="kbd sc-kbd" aria-hidden="true">/</span>
            </div>
            <p class="sc-stats" id="heroStats">&nbsp;</p>
        </div>
        <nav class="sc-tabs" id="tabs" aria-label="Categories"></nav>
    </div>
</header>

<main class="wrap">
    <div class="sc-facets" id="chips" role="toolbar" aria-label="Filters"></div>
    <div class="alert err" id="loadErr" role="alert" hidden></div>
    <div id="results"></div>
</main>
